[workspace]
members = ["cli", "core", "wasm"]
default-members = ["cli", "core"]
resolver = "2"

[workspace.package]
version = "4.0.0-78ce10c1"
description = "C/Rust like programming language that compiles into Lua code"
edition = "2021"
rust-version = "1.70"
authors = ["Rosy.iso"]
repository = "https://github.com/ClueLang/Clue"
license = "MIT"
keywords = ["language", "programming-language", "lua", "compiler", "transpiler"]
categories = ["compilers"]

[workspace.dependencies]
ahash = "0.8.12"
clap = { version = "4.5.39", features = ["derive", "cargo", "wrap_help"] }
colored = "3.0.0"
crossbeam-queue = "0.3.12"
flume = "0.11.1"
num_cpus = "1.17.0"

[profile.release]
lto = true
